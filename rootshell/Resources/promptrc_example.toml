# rootshell custom prompt configuration
# Save as ~/.promptrc.toml to activate
# This file overrides the theme selected in Settings
#
# Format string syntax (Starship-compatible subset):
#   $variable          → module expansion (e.g. $directory, $git_branch)
#   [text](style)      → styled text group
#   literal text       → passed through
#   \n                 → line break
#
# Style strings:
#   "bold fg:#hex bg:#hex"     → true color
#   "fg:red bg:bright-blue"   → ANSI named colors
#   "fg:palette_name"         → palette color reference
#   "bold italic underline dimmed" → text attributes
#
# Powerline arrows are auto-inserted between segments with different bg colors.
#
# Available modules:
#   $username       → Current user
#   $directory      → Working directory (with ~ and truncation)
#   $git_branch     → Git branch + status (only in git repos)
#   $time           → Current time
#   $battery        → Battery level
#   $character      → Input chevron (green/red based on last command)
#   $line_break     → Explicit line break
#   $wifi           → WiFi SSID and band (requires location permission)
#   $network        → Public IP, ISP, country flag (from cached data)
#   $connection_type → WiFi/Cellular/Wired icon

# --- Layout ---

# Leave a blank row between the previous command's output and the prompt.
# Default is true. Set false for a condensed prompt.
#
# add_newline = true

# Uncomment one format or write your own:

# Default (Catppuccin-style powerline):
# format = "$username$directory$git_branch$time\n$character"

# With network info:
# format = "$username$directory$git_branch$wifi$network$time\n$character"

# Minimal (two-line, no segments):
# format = "$directory$git_branch\n$character"

# Single line:
# format = "$directory$git_branch$character"

# Kitchen sink:
# format = "$username$directory$git_branch$wifi$network$connection_type$battery$time\n$character"

# With right prompt (moves time to right side of info bar):
# format = "$username$directory$git_branch\n$character"
# right_format = "$time"


# --- Right Prompt ---
# right_format places modules right-aligned on the info bar line
# (the line above ❯). Requires a two-line format with \n.
# Empty string (default) disables right prompt.
# Uses the same module syntax as format.
#
# right_format = ""
# right_format = "$time"
# right_format = "$git_branch$time"


# --- Transient Prompt ---
# When enabled, replaces the full prompt with a simplified version after
# a command is executed. This reduces visual clutter in scrollback while
# keeping the current prompt detailed. The transient format should be a
# single-line prompt (no \n needed).
#
# [transient_prompt]
# enabled = false
# format = "$character"                    # Default: just the ❯ chevron
# format = "[❯](bold fg:#a6e3a1) "        # Or use a styled literal


# --- Core Modules ---

# [character]
# success_symbol = "[❯](bold fg:#a6e3a1)"
# error_symbol = "[❯](bold fg:#f38ba8)"
# disabled = false

# [directory]
# format = "[ $path ](fg:#11111b bg:#fab387)"
# truncation_length = 3          # Keep last N path components
# truncation_symbol = "…/"       # Prefix when truncated
# disabled = false

# [git_branch]
# format = "[ $symbol $branch$status ](fg:#11111b bg:#a6e3a1)"
# symbol = ""                   # Nerd Font branch icon
# truncation_length = 0          # 0 = no truncation
# disabled = false

# [git_status]
# format = "$staged"
# staged = "+"                   # Symbol before staged count
# disabled = false

# [username]
# format = "[ $user ](fg:#11111b bg:#f38ba8)"
# show_always = true
# disabled = false

# [time]
# format = "[  $time ](fg:#11111b bg:#b4befe)"
# time_format = "%H:%M"          # strftime format; omit to use app preference
# disabled = false

# [battery]
# format = "[ $symbol $percentage ](fg:#11111b bg:#f9e2af)"
# charging_symbol = "⚡"
# discharging_symbol = "🔋"
# full_symbol = "🔋"
# display_threshold = 100        # Only show below this percentage
# disabled = false

# [line_break]
# disabled = false


# --- Network Modules (unique to rootshell) ---
# These use cached data — no blocking network calls at prompt time.
# Modules collapse to empty when data is unavailable.

# [wifi]
# format = "[ 󰤨 $ssid $band_icon ](fg:#11111b bg:#89b4fa)"
# band_icon_2_4 = "2.4"
# band_icon_5 = "5G"
# band_icon_6 = "6E"
# disabled = false

# [network]
# format = "[ $country_flag $isp ](fg:#11111b bg:#a6e3a1)"
# show_ip = false
# disabled = false

# [connection_type]
# format = "[$symbol](fg:#a6e3a1)"
# wifi_symbol = "󰤨"
# cellular_symbol = "󰣺"
# wired_symbol = "󰈁"
# disabled = false


